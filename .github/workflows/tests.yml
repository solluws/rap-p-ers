name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check the scripts still import
        run: |
          python -m compileall -q example.py devscripts/ examples/

      - name: Live tests are collectable but skipped without a token
        run: python -m pytest -m live -q

      - name: Wheel ships the protocol data files
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
          python - <<'EOF'
          import glob, zipfile, sys
          names = zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[-1]).namelist()
          data = [n for n in names if n.endswith(".json")]
          assert len(data) == 5, f"expected 5 data files in the wheel, got {data}"
          assert not [n for n in names if "examples" in n], "examples leaked into the wheel"
          print("wheel OK:", data)
          EOF

      - name: Installed wheel can read its registries
        if: runner.os == 'Linux'
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install --quiet dist/*.whl
          /tmp/v/bin/python -c "
          import sys
          from rootpy.structured_registry import MESSAGES
          assert len(MESSAGES) == 831
          import rootpy
          assert 'httpx' not in sys.modules, 'httpx must stay off the import path'
          assert 'rootpy.services.calls' not in sys.modules, 'voice must stay lazy'
          print('installed wheel OK')
          "
